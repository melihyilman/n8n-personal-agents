use_default_settings: true

general:
  debug: false
  instance_name: "n8n-Personal-Agent-SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "all"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "n8n-personal-agent-searxng-secret-key"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0
  useragent_suffix: "n8nPersonalAgent/1.0"

