version: "3.9"

services:
  postgres-rag:
    image: pgvector/pgvector:pg16
    container_name: n8n-postgres-rag
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_agent_secret}
      POSTGRES_DB: ${POSTGRES_DB:-n8n_orchestrator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_rag_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n_agent} -d ${POSTGRES_DB:-n8n_orchestrator}"]
      interval: 5s
      timeout: 5s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    container_name: n8n-searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8088}:8080"
    volumes:
      - ./config/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8088/

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: n8n-crawl4ai
    restart: unless-stopped
    ports:
      - "${CRAWL4AI_PORT:-11235}:11235"
    environment:
      - MAX_CONCURRENT_TASKS=5
    shm_size: "2g"

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-orchestrator
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres-rag
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n_orchestrator}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n_agent}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_agent_secret}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - HOST_BRIDGE_URL=${HOST_BRIDGE_URL:-http://host.docker.internal:8090}
      - SEARXNG_URL=http://searxng:8080
      - CRAWL4AI_URL=http://crawl4ai:11235
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows:ro
      - ${WORKSPACE_ROOT:-.}:/workspace
    depends_on:
      postgres-rag:
        condition: service_healthy

volumes:
  postgres_rag_data:
  n8n_data:

